<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Criar conta — SlixSlax</title>

  <link rel="stylesheet" href="style.css">

</head>

<body class="auth-body">

  <div class="background">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>


  <main class="auth-container">

    <div class="auth-card">

      <a href="index.html" class="back">
        ← Voltar
      </a>

      <div class="auth-logo">
        Slix<span>Slax</span>
      </div>

      <h1>
        Criar sua conta
      </h1>

      <p class="auth-description">
        Entre para fazer parte do SlixSlax.
      </p>


      <form id="registerForm">

        <div class="input-group">

          <label>
            Nome de usuário
          </label>

          <input
            type="text"
            id="username"
            placeholder="Ex: KryoPlayzzz"
            minlength="3"
            maxlength="20"
            required
          >

        </div>


        <div class="input-group">

          <label>
            E-mail
          </label>

          <input
            type="email"
            id="email"
            placeholder="voce@email.com"
            required
          >

        </div>


        <div class="input-group">

          <label>
            Senha
          </label>

          <input
            type="password"
            id="password"
            placeholder="Mínimo de 8 caracteres"
            minlength="8"
            required
          >

        </div>


        <div class="input-group">

          <label>
            Data de nascimento
          </label>

          <input
            type="date"
            id="birth_date"
            required
          >

        </div>


        <button
          type="submit"
          class="auth-button"
        >
          Criar minha conta
        </button>

      </form>


      <div
        id="message"
        class="form-message"
      ></div>


      <p class="auth-footer">

        Já possui uma conta?

        <a href="login.html">
          Entrar
        </a>

      </p>

    </div>

  </main>


  <script src="app.js"></script>

</body>
</html>
